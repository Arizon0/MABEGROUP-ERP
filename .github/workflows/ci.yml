name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes e migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        # USE_MOCK_CONNECTORS garante que a suíte não faz chamada de rede:
        # o CI não pode depender da disponibilidade das APIs dos marketplaces.
        env:
          USE_MOCK_CONNECTORS: '1'
          ENVIRONMENT: test
        run: pytest -q

      - name: Migrations aplicam e revertem
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic downgrade base

  frontend:
    name: Frontend (tipos, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build

  seguranca:
    name: Segurança (dependências e segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Auditoria de dependências Python
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true

      - name: Varredura de segredos
        # Um token de marketplace no repositório é incidente crítico:
        # dá acesso de escrita à conta do vendedor.
        run: |
          if grep -rInE '(APP_USR-[A-Za-z0-9-]{20,}|TG-[A-Za-z0-9]{20,})' \
               --include='*.py' --include='*.ts' --include='*.tsx' \
               --include='*.yml' --include='*.json' . ; then
            echo "::error::Possível credencial de marketplace versionada."
            exit 1
          fi
          echo "Nenhum segredo encontrado."
