# Sobe a plataforma inteira em modo simulado: nenhuma credencial de marketplace
# é necessária para ver o produto funcionando ponta a ponta.
#
#   docker compose up --build
#   Painel:  http://localhost:5173
#   API:     http://localhost:8000/docs
#   Acesso:  admin@marketplacehub.com.br / admin123

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace_hub
    ports: ['5432:5432']
    volumes: ['dados_postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace_hub']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ['6379:6379']
    volumes: ['dados_redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # As migrations rodam como job próprio, ANTES da API subir. Executá-las no
  # startup de N réplicas causaria migrations concorrentes.
  migrations:
    build: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://marketplace:marketplace@db:5432/marketplace_hub
    depends_on:
      db: {condition: service_healthy}

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: &ambiente
      # Banco e Redis apontam para os serviços do compose, não para localhost —
      # por isso não vêm do .env (que traz os endereços de execução sem Docker).
      DATABASE_URL: postgresql+asyncpg://marketplace:marketplace@db:5432/marketplace_hub
      REDIS_URL: redis://redis:6379/0

      # O restante vem do arquivo `.env` na raiz, que o Compose lê sozinho.
      # Os valores após ":-" são o padrão quando a variável não está definida —
      # é o que mantém o modo simulado funcionando sem nenhuma configuração.
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      USE_MOCK_CONNECTORS: ${USE_MOCK_CONNECTORS:-1}
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-em-producao-0000000000}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      BUYER_HASH_PEPPER: ${BUYER_HASH_PEPPER:-dev-pepper-troque-em-producao}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}

      # Credenciais dos marketplaces. Vazias = o canal aparece como
      # "não configurado" na tela de Configurações, em vez de oferecer um botão
      # que levaria a um erro do marketplace.
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      ML_REDIRECT_URI: ${ML_REDIRECT_URI:-http://localhost:8000/api/v1/oauth/mercadolivre/callback}
      MP_CLIENT_ID: ${MP_CLIENT_ID:-}
      MP_CLIENT_SECRET: ${MP_CLIENT_SECRET:-}
      MP_REDIRECT_URI: ${MP_REDIRECT_URI:-http://localhost:8000/api/v1/oauth/mercadopago/callback}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
      SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
      SHOPEE_REDIRECT_URI: ${SHOPEE_REDIRECT_URI:-http://localhost:8000/api/v1/oauth/shopee/callback}
      SHOPEE_API_BASE: ${SHOPEE_API_BASE:-https://partner.shopeemobile.com}

      BACKFILL_DAYS: ${BACKFILL_DAYS:-90}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
    ports: ['8000:8000']
    volumes: ['./backend:/app']
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrations: {condition: service_completed_successfully}

  # Worker separado da API de propósito: um backfill de 24 meses satura CPU por
  # horas e deixaria o painel lento se dividisse o processo.
  worker:
    build: ./backend
    command: arq app.workers.settings.WorkerSettings
    environment: *ambiente
    volumes: ['./backend:/app']
    # O healthcheck da imagem consulta http://localhost:8000/health, que existe
    # na API. O worker roda `arq` e não sobe servidor HTTP nenhum, então
    # herdá-lo faria o contêiner aparecer como "unhealthy" para sempre — um
    # alarme falso que manda procurar defeito onde não há. Aqui a verificação é
    # a que corresponde ao processo que de fato roda neste contêiner.
    healthcheck:
      # Verifica o que de fato pode falhar sem derrubar o contêiner: o worker
      # vivo mas sem alcançar o Redis, situação em que ele para de consumir a
      # fila em silêncio. Usa só o que já está instalado — `pgrep` exigiria o
      # pacote procps, que não está na imagem.
      test:
        - CMD
        - python
        - -c
        - |
          import asyncio, os
          from redis.asyncio import from_url
          asyncio.run(from_url(os.environ["REDIS_URL"]).ping())
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      api: {condition: service_started}

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ['5173:5173']
    volumes: ['./frontend:/app', '/app/node_modules']
    depends_on: [api]

volumes:
  dados_postgres:
  dados_redis:
